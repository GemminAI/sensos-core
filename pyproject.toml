[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensos-core"
version = "0.1.0"
description = "SensOS Core Engine — MeaningMapper, MSR, CLE (SPEC-MM-001_v2 / SPEC-MSR-001_v2 / SPEC-CLE-001_v2)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rfc8785>=0.1.4",
    # Not on PyPI: local sibling repo, editable-installed
    # (`pip install -e ../meaning-space-runtime`). A plain `pip install .`
    # or `uv sync` will not resolve this on its own.
    "meaning-space-runtime",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    # Not on PyPI: local sibling repo, editable-installed
    # (`pip install -e ../categorical-lift-engine`). Only needed to assert
    # msr.abi.StabilizedTrajectory satisfies cle.abi.inputs.StabilizedTrajectoryLike
    # (tests/test_trajectory_cle_protocol.py) — sensos-core's own runtime
    # code does not depend on cle.
    "categorical-lift-engine",
]

[tool.setuptools.packages.find]
include = ["sensos_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
